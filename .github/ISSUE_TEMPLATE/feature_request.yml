name: Feature Request
description: Propose a new feature or enhancement for PyThermoNDT.
labels: [new feature]
body:
  - type: textarea
    attributes:
      label: Problem / Motivation
      description: |
        What problem does this feature solve? Why is it valuable?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Proposed Solution
      description: |
        Describe the feature you'd like to see. Include API sketches, config changes,
        or transform behavior if applicable.

  - type: textarea
    attributes:
      label: Alternatives Considered
      description: Any alternative approaches or workarounds you've evaluated.

  - type: textarea
    attributes:
      label: Additional Context
      description: References, related issues, or anything else that supports the request.
