name: Build

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to build (branch, tag, or commit SHA)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
        # Step 1: Checkout code in the specified release branch
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

        # Step 2: Setup uv for building the package
      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version-file: requirements_dev.txt
          python-version: ${{ vars.DEFAULT_PYTHON_VERSION }}
          activate-environment: true
          save-cache: false # Disable cache for pip build
          restore-cache: false # Disable cache for pip build

        # Step 3: Build the package
      - name: Build package
        id: build
        env:
          BUILD_REF: ${{ inputs.ref }}
        run: |
          uv build --no-sources .
          echo "Successfully built pythermondt from ref $BUILD_REF"
          echo "WHEEL_FILE=$(ls dist/*.whl)" >> $GITHUB_OUTPUT
          echo "TAR_FILE=$(ls dist/*.tar.gz)" >> $GITHUB_OUTPUT

        # Step 4: Upload artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: build-artifacts
          path: |
            ${{ steps.build.outputs.WHEEL_FILE }}
            ${{ steps.build.outputs.TAR_FILE }}
