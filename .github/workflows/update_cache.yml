# Updates the cache in main branch, because only caches from default branch are available in other branches. ==> allows for faster CI in other branches
name: update-cache

on:
  workflow_dispatch:
  push:
    branches:
      - "main" # Update cache on main branch

jobs:
  build-cache:
    name: Build Cache
    runs-on: ubuntu-latest
    env:
      UV_TORCH_BACKEND: cpu  # Set the backend to CPU to avoid installing cuda dependencies for tests
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Step 2: Setup uv
      - name: Setup uv
        id: setup-uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version-file: requirements_dev.txt
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          cache-dependency-glob: ${{ vars.CACHE_DEPENDENCY_GLOB }}
          prune-cache: true # Retain source-built wheels (numpy on py3.14); setup-uv v9+ defaults to false

      # Step 2.1: Log cache status
      - name: Log cache status
        run: |
          echo "cache-hit=${{ steps.setup-uv.outputs.cache-hit }}"
          echo "cache-key=${{ steps.setup-uv.outputs.cache-key }}"

      # Step 3: Sync dependencies and refresh cache
      - name: Sync dependencies
        run: |
          uv pip install -r ./requirements_dev.txt # Install dev dependencies
          uv pip install -e .
