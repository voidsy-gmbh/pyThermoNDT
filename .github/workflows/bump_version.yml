name: Bump version
description: 'Reusable workflow to bump the version of PyThermoNDT'

on:
  workflow_call:
    inputs:
      bump-type:
        description: 'The type of bump to perform'
        required: true
        type: string
        default: 'patch'
      ref:
        description: 'The branch or tag to bump the version in'
        required: true
        type: string
        default: ''
    secrets:
      WRITE_KEY:
        description: 'SSH key to push changes'
        required: true
    outputs:
      bumped:
        description: 'Whether the version was bumped'
        value: ${{ jobs.bump.outputs.bumped }}
      previous-version:
        description: 'The previous version'
        value: ${{ jobs.bump.outputs.previous-version }}
      current-version:
        description: 'The current version'
        value: ${{ jobs.bump.outputs.current-version }}

  workflow_dispatch:
    inputs:
      bump-type:
        description: 'The type of bump to perform'
        required: true
        default: 'patch'
        type: choice
        options:
        - major
        - minor
        - patch
        - release


jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      bumped: ${{ steps.bump.outputs.bumped }}
      previous-version: ${{ steps.bump.outputs.previous-version }}
      current-version: ${{ steps.bump.outputs.current-version }}
    steps:
      # Step 1.1: Checkout repository (workflow_call) (see https://dev.to/koseimori/conditional-branching-with-workflowdispatch-and-workflowcall-in-github-actions-oik)
      - name: Checkout repository
        if: github.event.workflow != '.github/workflows/bump_version.yml'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0  # Required for tags history
          ssh-key: ${{ secrets.WRITE_KEY }} # TODO: Replace with GitHub App: https://github.com/orgs/community/discussions/25305#discussioncomment-8256560
          ref: ${{ inputs.ref }}

      # Step 1.2: Checkout repository (workflow_dispatch)
      - name: Checkout repository
        if: github.event.workflow == '.github/workflows/bump_version.yml'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0  # Required for tags history
          ssh-key: ${{ secrets.WRITE_KEY }} # TODO: Replace with GitHub App: https://github.com/orgs/community/discussions/25305#discussioncomment-8256560

      # Step 2: Setup uv
      - name: Setup uv
        id: setup-uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version-file: requirements_dev.txt
          python-version: ${{ vars.DEFAULT_PYTHON_VERSION }}
          activate-environment: true
          save-cache: false

      # Step 3: Setup github user
      - name: Setup git user
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      # Step 4: Bump version
      - name: Bump version
        id: bump
        run: |
          PREV=$(uv version --short)
          echo "previous-version=$PREV" >> $GITHUB_OUTPUT

          if [ "${{ inputs.bump-type }}" = "release" ]; then
            uv version --no-sync --bump stable
          else
            base=$(uv version --no-sync --bump ${{ inputs.bump-type }} --dry-run --short)
            uv version --no-sync "$base.dev0"
          fi

          NEW=$(uv version --short)
          echo "current-version=$NEW" >> $GITHUB_OUTPUT

          if git diff --quiet pyproject.toml; then
            echo "bumped=false" >> $GITHUB_OUTPUT
          else
            echo "bumped=true" >> $GITHUB_OUTPUT
            git add pyproject.toml
            git commit -m "Bump version: $PREV → $NEW"
          fi

      # Step 5: Check if the version was bumped
      - name: Check
        if: steps.bump.outputs.bumped == 'true'
        run: |
          echo "Version was bumped from ${{ steps.bump.outputs.previous-version }} to ${{ steps.bump.outputs.current-version }}!"

      # Step 6: Push changes
      - name: Push changes
        if: steps.bump.outputs.bumped == 'true'
        run: |
          git push
