name: PR Checks

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    uses: $/.github/workflows/tests.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}

  quality-checks:
    name: Run Code Quality Checks
    uses: $/.github/workflows/code_ql.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: test
    permissions:
      pull-requests: write # Required by the pytest-coverage-comment action
    steps:
      - name: Download coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: coverage-data-python-*

      - name: Pytest coverage comment
        uses: MishaKav/pytest-coverage-comment@9516bf7f32a9229cf18d5e1717ae387c7154f279
        with:
          pytest-coverage-path: ./pytest-coverage.txt
          junitxml-path: ./pytest.xml
          title: Coverage Report
