name: Run Tests
description: 'Reusable workflow to run all tests for PyThermoNDT'

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'The branch or tag to test. Defaults to the reference of the workflow trigger'
        type: string
        default: ''
    secrets:
      AZURE_CLIENT_ID:
        description: 'Client ID of the federated Azure identity'
        required: false
      AZURE_TENANT_ID:
        description: 'Tenant ID of the federated Azure identity'
        required: false
      AZURE_SUBSCRIPTION_ID:
        description: 'Subscription containing the Azure test data'
        required: false

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      UV_TORCH_BACKEND: cpu  # Set the backend to CPU to avoid installing cuda dependencies for tests
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      # Step 1.1: Checkout repository (workflow_call) (see https://dev.to/koseimori/conditional-branching-with-workflowdispatch-and-workflowcall-in-github-actions-oik)
      - name: Checkout repository
        if: github.event.workflow != '.github/workflows/tests.yml'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # Step 1.2: Checkout repository (workflow_dispatch)
      - name: Checkout repository
        if: github.event.workflow == '.github/workflows/tests.yml'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # Step 2: Setup uv
      - name: Setup uv
        id: setup-uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version-file: requirements_dev.txt
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          cache-dependency-glob: ${{ vars.CACHE_DEPENDENCY_GLOB }}
          save-cache: false
          prune-cache: true # Retain source-built wheels (numpy on py3.14); setup-uv v9+ defaults to false

      # Step 2.1: Log cache status
      - name: Log cache status
        env:
          CACHE_HIT: ${{ steps.setup-uv.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.setup-uv.outputs.cache-key }}
        run: |
          echo "cache-hit=$CACHE_HIT"
          echo "cache-key=$CACHE_KEY"

      # Step 3 Sync dependencies if cache hit
      - name: Sync dependencies
        run: |
          uv pip install -r ./requirements_dev.txt # Install dev dependencies
          uv pip install -e .

      # Authenticate only trusted PRs and main-branch runs covered by Azure federation.
      - name: Log in to Azure with OIDC
        id: azure-login
        if: >-
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') ||
          ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main')
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Do not cache private test data: fork PRs can restore base-branch Actions caches.

      # Step 4: Run tests without coverage
      - name: Run Tests
        if: matrix.python-version != vars.DEFAULT_PYTHON_VERSION
        env:
          REMOTE_TESTS: ${{ steps.azure-login.outcome == 'success' }}
          TEST_ACCOUNT_URL: ${{ vars.TEST_ACCOUNT_URL }}
          TEST_CONTAINER_NAME: ${{ vars.TEST_CONTAINER_NAME }}
          TEST_PREFIX: ${{ vars.TEST_PREFIX }}
        run: pytest --benchmark-skip

      # Step 4.1: Run tests with coverage on default python version
      - name: Run Tests
        if: matrix.python-version == vars.DEFAULT_PYTHON_VERSION
        env:
          REMOTE_TESTS: ${{ steps.azure-login.outcome == 'success' }}
          TEST_ACCOUNT_URL: ${{ vars.TEST_ACCOUNT_URL }}
          TEST_CONTAINER_NAME: ${{ vars.TEST_CONTAINER_NAME }}
          TEST_PREFIX: ${{ vars.TEST_PREFIX }}
        run: pytest --junitxml=pytest.xml --cov-config=.coveragerc --cov-report=term-missing:skip-covered --cov-report=xml:coverage.xml --cov=pythermondt --ignore=tests/benchmark tests/ | tee pytest-coverage.txt

      # Step 5: Create artifact for coverage data
      - name: Upload coverage data
        if: matrix.python-version == vars.DEFAULT_PYTHON_VERSION
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-data-python-${{ matrix.python-version }}
          path: |
            pytest.xml
            pytest-coverage.txt
