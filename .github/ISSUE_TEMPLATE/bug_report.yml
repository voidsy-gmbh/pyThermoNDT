name: Bug Report
description: Report a bug in PyThermoNDT.
labels: [bug]
body:
  - type: textarea
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to trigger the bug.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected Behavior
      description: What you expected to happen.

  - type: textarea
    attributes:
      label: Environment
      description: |
        PyThermoNDT version, Python version, OS, and any other relevant details.
      placeholder: |
        pythermondt 0.3.7.dev0
        Python 3.11
        Ubuntu 24.04
      render: text
    validations:
      required: true

  - type: textarea
    attributes:
      label: Additional Context
      description: Logs, screenshots, tracebacks, or anything else that might help.
